# ─────────────────────────────────────────────────────────────────
# LCH Harness — project config template
# Generated by lch-harness install. Override values in:
#   _lch/custom/config.toml       (team, committed)
#   _lch/custom/config.user.toml  (personal, gitignored)
# ─────────────────────────────────────────────────────────────────

[core]
project_name = "awsevents_agent"
document_output_language = "English"
output_folder = "_lch-output"

[modules.bmm]
planning_artifacts = "{project-root}/_lch-output/planning-artifacts"
implementation_artifacts = "{project-root}/_lch-output/implementation-artifacts"
project_knowledge = "{project-root}/docs"
user_skill_level = "intermediate"

[modules.bmb]
lch_builder_output_folder = "{project-root}/skills"
lch_builder_reports = "{project-root}/skills/reports"

[modules.tea]
test_artifacts = "{project-root}/_lch-output/test-artifacts"
tea_use_playwright_utils = false
tea_use_pactjs_utils = false
tea_browser_automation = "auto"
tea_execution_mode = "auto"
tea_capability_probe = true
test_stack_type = "auto"
ci_platform = "auto"
test_framework = "auto"
risk_threshold = "p1"
test_design_output = "_lch-output/test-artifacts/test-design"
test_review_output = "_lch-output/test-artifacts/test-reviews"
trace_output = "_lch-output/test-artifacts/traceability"

