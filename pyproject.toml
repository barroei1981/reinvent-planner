[project]
name = "awsevents-agent"
version = "0.1.0"
description = "re:Invent session planner — score, schedule, and auto-register AWS event seats"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "playwright>=1.44",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
awsevents = "agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
